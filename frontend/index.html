<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroDoc AI | Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Marked.js for rendering markdown answers cleanly -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Clean Minimalist Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo-icon">✈️</div>
        <div>
          <h2>AeroDoc AI</h2>
          <span class="sub-status"><span class="status-dot online" id="statusDot"></span> Ready</span>
        </div>
      </div>

      <div class="quick-questions">
        <label>Common Questions</label>
        <button class="pill-btn" onclick="sendPrompt('What is the baggage allowance for economy class?')">Baggage allowance for economy</button>
        <button class="pill-btn" onclick="sendPrompt('Tell me about the Armed Forces Discount Program')">Armed Forces Discount</button>
        <button class="pill-btn" onclick="sendPrompt('What are the key specifications of the Airbus A350?')">Airbus A350 specs</button>
        <button class="pill-btn" onclick="sendPrompt('Summarize the boarding process and seat change rules')">Boarding & Seat rules</button>
      </div>

      <div class="sidebar-footer">
        <button id="clearBtn" class="clear-btn">Clear Chat</button>
      </div>
    </aside>

    <!-- Main Chat Workspace -->
    <main class="chat-main">
      <header class="chat-header">
        <div>
          <h3>Document Assistant</h3>
        </div>
      </header>

      <div class="messages-container" id="messagesContainer">
        <!-- Welcome Message -->
        <div class="message assistant-message">
          <div class="avatar">🤖</div>
          <div class="message-content">
            <div class="formatted-text">
              <p>Hello! How can I assist you with the airline documents and policies today?</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <footer class="chat-footer">
        <form id="chatForm" class="input-form">
          <textarea 
            id="queryInput" 
            placeholder="Ask a question..."
            rows="1"
            required
          ></textarea>
          <button type="submit" id="sendBtn" class="send-btn" title="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
